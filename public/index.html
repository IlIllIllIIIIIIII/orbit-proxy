<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0b1020" />
    <title>Orbit Proxy</title>
    <link rel="stylesheet" href="/styles.css" />
    <link rel="stylesheet" href="/zen.css" />
    <script src="/js/blank-window.js" defer></script>
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3493536113084825"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <aside id="blank-launcher" class="blank-launcher" hidden aria-label="Open proxy in a new tab">
      <span id="blank-message" role="status"></span>
      <button id="blank-open" type="button">Open in about:blank</button>
    </aside>
    <main class="shell">
      <aside class="sidebar" id="sidebar" aria-label="Browser tabs">
        <div class="sidebar-heading" aria-hidden="true"><i></i><i></i><i></i></div>
        <button id="new-tab" class="new-tab" type="button">＋ New tab</button>
        <p class="sidebar-label">☀ <span>Personal</span></p>
        <nav id="tab-list" aria-label="Open tabs"></nav>
        <div class="sidebar-footer"><button id="settings-open" type="button" title="Proxy settings" aria-label="Proxy settings">⚙</button><span title="Personal workspace">☀</span><button id="focus-address" type="button" title="Search" aria-label="Focus address bar">⌕</button></div>
      </aside>
      <header class="toolbar">
        <button id="sidebar-toggle" class="icon-button" type="button" aria-label="Toggle sidebar" aria-controls="sidebar" aria-expanded="true">☰</button>
        <a class="brand" href="/" aria-label="Orbit Proxy home">
          <span class="brand-mark" aria-hidden="true">◉</span>
          <span>Orbit</span>
        </a>
        <nav class="controls" aria-label="Proxy navigation">
          <button id="back" class="icon-button" type="button" title="Back" disabled>←</button>
          <button id="forward" class="icon-button" type="button" title="Forward" disabled>→</button>
          <button id="reload" class="icon-button" type="button" title="Reload" disabled>↻</button>
          <button id="fullscreen" class="icon-button" type="button" title="Enter fullscreen" disabled>⛶</button>
        </nav>
        <form id="address-form" class="address-form">
          <label class="sr-only" for="address">Website address or search</label>
          <input
            id="address"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="Search with Google or enter address"
            inputmode="url"
          />
          <button type="submit">Go</button>
        </form>
        <span id="status" class="status" aria-live="polite">Starting…</span>
      </header>

      <section id="welcome" class="welcome" aria-labelledby="welcome-title">
        <p class="eyebrow">YOUR SPACE ON THE WEB</p>
        <h1 id="welcome-title">Where to next?</h1>
        <p class="welcome-copy">
          Search something new. Pick up where you left off.
        </p>
        <form id="welcome-form" class="welcome-form">
          <label class="sr-only" for="welcome-address">Website address or search</label>
          <input
            id="welcome-address"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            placeholder="https://example.com"
            inputmode="url"
          />
          <button type="submit">Open site</button>
        </form>
        <div class="proxy-options">
          <label>Engine <select id="proxy-engine">
            <option value="prism">Scramjet V2 (Prism)</option>
            <option value="polygon">Scramjet (Polygon)</option>
            <option value="glass">Ultraviolet (Glass)</option>
          </select></label>
          <label>Transport <select id="proxy-transport">
            <option value="libcurlRaw">libcurl</option>
            <option value="epoxy">Epoxy</option>
            <option value="libcurl">libcurl + Reflux (legacy engines)</option>
          </select></label>
        </div>
        <nav class="shortcuts" aria-label="Website shortcuts">
          <button type="button" data-proxy-url="https://youtube.com" disabled>YouTube</button>
          <button type="button" data-proxy-url="https://play.geforcenow.com/mall/" disabled>GeForce NOW</button>
        </nav>
        <p class="hint">Use only sites and services you are authorized to access.</p>
      </section>

      <section id="proxy-view" class="proxy-view" hidden aria-label="Proxied website">
        <iframe id="proxy-frame" title="Proxied website" referrerpolicy="no-referrer" allowfullscreen></iframe>
      </section>
    </main>
    <dialog id="proxy-settings" aria-labelledby="settings-title">
      <form method="dialog" class="settings-heading"><h2 id="settings-title">Proxy settings</h2><button aria-label="Close settings">×</button></form>
      <p>Choose the engine and transport for your next navigation.</p>
    </dialog>

    <script src="/charon/index.js"></script>
    <script src="/glass/glass.bundle.js"></script>
    <script src="/glass/glass.config.js"></script>
    <script src="/poly/polygon.all.js"></script>
    <script src="/prism/prism.js"></script>
    <script src="/prism/prism.api.js"></script>
    <script src="/utils/scramjet-utils.js"></script>
    <script src="/prism/libby.js"></script>
    <script src="/prism/libbyworse.js"></script>
    <script src="/config.js"></script>
    <script src="/js/codec.js"></script>
    <script src="/js/zen.js"></script>
    <script src="/js/engine.js"></script>
    <script src="/js/app.js"></script>
  </body>
</html>
